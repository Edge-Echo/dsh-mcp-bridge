name: What are you using it for?
description: One line about the actual task — more useful than a star.
title: "[usage] "
labels: ["usage"]
body:
  - type: markdown
    attributes:
      value: |
        Downloads say this gets installed; they do not say whether it helps. If you have a minute,
        the task itself is the useful part — especially if it did **not** work.

  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: The actual task, in your own words. One or two sentences is plenty.
      placeholder: We ship plugins from CI and wanted a machine-checkable record of what was tested.
    validations:
      required: true

  - type: dropdown
    id: outcome
    attributes:
      label: Did it do the job?
      options:
        - Worked as expected
        - Worked, but I had to change something
        - Did not work
        - Still evaluating
    validations:
      required: true

  - type: textarea
    id: friction
    attributes:
      label: What got in the way?
      description: Missing capability, confusing output, a crash, docs that did not match — anything.
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and dsh-mcp-bridge version, if you know them.
      placeholder: Windows 11, dsh-mcp-bridge@0.2.1
    validations:
      required: false
