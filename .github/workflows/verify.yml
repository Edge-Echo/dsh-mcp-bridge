name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: CLI tests (offline)
        # Deterministic: add/probe is pointed at a bogus package with a short timeout, so this
        # asserts entry-writing and exit codes rather than the network.
        run: node scripts/test-cli.mjs

      - name: Verify curated MCP servers (zero-config ones)
        run: node scripts/verify-servers.mjs
        env:
          VERIFY_TIMEOUT_MS: 45000
