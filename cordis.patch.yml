# dsh-mcp-bridge — 精选、验证过的 MCP server 全家桶
#
# 本层 insert 一组 @deepseek-ai/dsh-mcp-client 条目，把外部 MCP server 的
# 工具注册进 ctx.tools，模型即可通过 mcp__<serverName>__<toolName> 调用。
#
# · 每个 server 的权威定义在 servers/*.json（机器可读 + 验证状态）；
# · scripts/verify-servers.mjs 批量验证连通性（npm run verify）；
# · 默认只启用零配置演示 server（everything）；其余按需取消注释。
#
# 提示：
# - serverName 在同一进程内必须唯一（[A-Za-z0-9_-]{1,32}）。
# - 改 profile 的 cordis.patch.yml 后 HMR 热替换，无需重启。
# - failOnStartupError 默认 false：server 连不上只记日志、不注册工具，不致命。

- insert:
    # ── 默认启用：MCP 官方 everything 演示 server（零配置）─────────
    # 提供 echo / add / longRunningOperation / getTinyImage 等 13 个工具。
    - id: mcp-everything
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: everything
        transport: stdio
        command: npx
        args: ['-y', '@modelcontextprotocol/server-everything']

    # ── 零配置精选（取消注释即启用）────────────────────────────────

    # 会话内知识图谱（实体/关系/观察），9 个工具
    # - id: mcp-memory
    #   name: '@deepseek-ai/dsh-mcp-client'
    #   config:
    #     serverName: memory
    #     transport: stdio
    #     command: npx
    #     args: ['-y', '@modelcontextprotocol/server-memory']

    # 文件读写/搜索（14 个工具），最后一个参数必须是【真实存在的根目录】
    # - id: mcp-filesystem
    #   name: '@deepseek-ai/dsh-mcp-client'
    #   config:
    #     serverName: filesystem
    #     transport: stdio
    #     command: npx
    #     args:
    #       - '-y'
    #       - '@modelcontextprotocol/server-filesystem'
    #       - 'C:/path/to/allowed/root'

    # ── 需配置的精选（见 servers/*.json 的 note）────────────────────

    # GitHub（需 GITHUB_TOKEN 环境变量；包名以生态当前为准，官方已迁移 github-mcp-server）
    # - id: mcp-github
    #   name: '@deepseek-ai/dsh-mcp-client'
    #   config:
    #     serverName: github
    #     transport: stdio
    #     command: npx
    #     args: ['-y', '@modelcontextprotocol/server-github']
    #     env:
    #       GITHUB_TOKEN: !!js process.env.GITHUB_TOKEN

    # Playwright 浏览器自动化（首次运行需下载浏览器，较重）
    # - id: mcp-playwright
    #   name: '@deepseek-ai/dsh-mcp-client'
    #   config:
    #     serverName: playwright
    #     transport: stdio
    #     command: npx
    #     args: ['-y', '@playwright/mcp']

    # 自建 / 托管的远程 HTTP MCP server（streamable-http，可带认证头）
    # - id: mcp-remote
    #   name: '@deepseek-ai/dsh-mcp-client'
    #   config:
    #     serverName: remote
    #     transport: streamable-http
    #     url: http://localhost:3000/mcp
    #     headers:
    #       Authorization: !!js '`Bearer ${process.env.MCP_TOKEN}`'
